
<html>
  <head>
    <link rel=stylesheet href="styles.css">
    <link rel=icon href="favicon.ico">
  </head>
  
  <body id="body1" width="100%" height="100%" style="background-color:#3d3d3d;">
    <title>Site.png</title>
    <p>
    <a id="link1" href="/70403" style="color:rgb(255,255,255);">Roll the Ball</a><br>
    <a id="link2" href="https://beaneth-iii.itch.io/roll-the-ball" style="color:rgb(255,255,255);">Roll the Ball (Itch.io)</a><br>
    <a id="link3" href="/391" style="color:rgb(255,255,255);">Platformer (Demo)</a><br>
    </p>
    <script>
      var body = document.getElementById("body1");
      var link1 = document.getElementById("link1");
      var link2 = document.getElementById("link2");
      var link3 = document.getElementById("link3");
      var bgcolor = [Float64Array,Float64Array,Float64Array];
      var txtcolor = [Float64Array,Float64Array,Float64Array];
      function changeColor(){
        bgcolor = [Math.round(Math.floor(Math.random() * 256)),Math.round(Math.floor(Math.random() * 256)),Math.round(Math.floor(Math.random() * 256))];
        txtcolor = [Math.round(Math.abs(255 - bgcolor[0])),Math.round(Math.abs(255 - bgcolor[1])),Math.round(Math.abs(255 - bgcolor[2]))];
        body.style.backgroundColor = `rgb(${bgcolor[0]}, ${bgcolor[1]},${bgcolor[2]})`;
        link1.style.color = `rgb(${txtcolor[0]}, ${txtcolor[1]},${txtcolor[2]})`;
        link2.style.color = `rgb(${txtcolor[0]}, ${txtcolor[1]},${txtcolor[2]})`;
        link3.style.color = `rgb(${txtcolor[0]}, ${txtcolor[1]},${txtcolor[2]})`;
      }
      
      body.addEventListener('click', changeColor)
      body.onclick = changeColor
      //${txtcolor[0]}, ${txtcolor[1]},${txtcolor[2]}
    </script>
  </body>
</html>
