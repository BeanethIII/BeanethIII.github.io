
<html>
  <head>
    <link rel=stylesheet href="styles.css">
  </head>
  
  <body id="body1" width="100%" height="100%" style="background-color:#3d3d3d;">
    <p>
    <a href="/70403">Roll the Ball</a><br>
    <a href="https://beaneth-iii.itch.io/roll-the-ball">Roll the Ball (Itch.io)</a><br>
    <a href="/391">Platformer (Demo)</a><br>
    </p>
    <script>
      var body = document.getElementById("body1");
      var bgcolor1 = 0;
      var bgcolor2 = 0;
      var bgcolor3 = 0;
      function changebg(){
        bgcolor1 = Math.floor(Math.random() * 256);
        bgcolor2 = Math.floor(Math.random() * 256);
        bgcolor3 = Math.floor(Math.random() * 256);
        body.style.backgroundColor = `rgb(${Math.round(bgcolor1)}, ${Math.round(bgcolor2)}, ${Math.round(bgcolor3)})`
      }
      
      body.addEventListener('click', changebg)
      body.onclick = changebg
    </script>
  </body>
</html>
